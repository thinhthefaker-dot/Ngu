<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Discord Webhook Sender</title>
<style>
body{
font-family:Arial;
background:#1e1f22;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:#2b2d31;
padding:20px;
border-radius:10px;
width:320px;
}

input,textarea{
width:100%;
margin-top:8px;
margin-bottom:12px;
padding:8px;
border:none;
border-radius:6px;
outline:none;
}

button{
width:100%;
padding:10px;
background:#3ba55d;
border:none;
border-radius:6px;
color:white;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#2f8f4e;
}
</style>
</head>

<body>

<div class="box">

<label>Webhook Discord</label>
<input id="webhook" placeholder="Dán webhook">

<label>Nội dung</label>
<textarea id="msg" rows="4" placeholder="Nhập tin nhắn"></textarea>

<button onclick="send()">Gửi</button>

</div>

<script>
function send(){

let webhook=document.getElementById("webhook").value
let text=document.getElementById("msg").value

fetch(webhook,{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
embeds:[
{
description:text,
color:5763719
}
]
})
})

}
</script>

</body>
</html>
