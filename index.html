<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Webhook Sender</title>

<link href="https://fonts.googleapis.com/css2?family=gg+sans:wght@400;600&display=swap" rel="stylesheet">

<style>
body{
background:#1e1f22;
font-family:"gg sans", Arial;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.panel{
background:#2b2d31;
padding:20px;
border-radius:10px;
width:340px;
}

input,textarea{
width:100%;
padding:10px;
margin-top:8px;
margin-bottom:12px;
background:#1e1f22;
border:1px solid #3f4147;
border-radius:6px;
color:white;
font-family:"gg sans";
}

button{
width:100%;
padding:10px;
background:#5865f2;
border:none;
border-radius:6px;
color:white;
font-weight:600;
cursor:pointer;
}

button:hover{
background:#4752c4;
}
</style>

</head>

<body>

<div class="panel">

<div>Webhook</div>
<input id="webhook" placeholder="dán webhook discord">

<div>Message</div>
<textarea id="msg" rows="7" placeholder="@everyone
Player Information:
Name: ..."></textarea>

<button onclick="send()">Send</button>

</div>

<script>

function send(){

let webhook=document.getElementById("webhook").value
let text=document.getElementById("msg").value

let lines=text.split("\n")

let first=lines[0]
let rest=lines.slice(1).join("\n")

if(first.startsWith("@everyone")){

fetch(webhook,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
content:first
})
})

if(rest.trim()!=""){

fetch(webhook,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
embeds:[
{
description:rest,
color:3447003
}
]
})
})

}

}else{

fetch(webhook,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
embeds:[
{
description:text,
color:3447003
}
]
})
})

}

}

</script>

</body>
</html>
